schema_version: 1
note: "Documentation mirror of the executable Python registry; Python definitions are authoritative."
skills:
  retract_arm:
    resources: [arm]
    parameters: {arm: {type: string, enum: [left, right]}}
    expected_effect: "<arm>_arm_safe=true"
    timeout_s: 15
  extend_arm:
    resources: [arm]
    parameters: {arm: {type: string, enum: [left, right]}}
    expected_effect: "<arm>_arm_safe=false"
    timeout_s: 15
  move_agv:
    resources: [agv]
    parameters:
      distance_m: {type: number, minimum: -5.0, maximum: 5.0}
      speed_mps: {type: number, minimum: 0.01, maximum: 0.5, required: false}
    expected_effect: "agv_position_m += distance_m when observable"
    timeout_s: 30
  set_lift:
    resources: [lift]
    parameters: {height_mm: {type: number, minimum: 0.0, maximum: 780.0}}
    expected_effect: "lift_height_mm=height_mm"
    timeout_s: 20
  set_head:
    resources: [head]
    parameters:
      yaw_deg: {type: number, minimum: -90.0, maximum: 90.0, required: false}
      pitch_deg: {type: number, minimum: -45.0, maximum: 20.0, required: false}
    expected_effect: "requested head axes reach their targets"
    timeout_s: 10
