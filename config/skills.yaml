schema_version: 2
note: "Documentation mirror of the executable Python registry; Python definitions are authoritative."
skills:
  retract_arm:
    resources: [arm]
    incompatible_resources: [agv, lift]
    parameters: {arm: {type: string, enum: [left, right]}}
    preconditions:
      - {field: "{arm}_arm_ready", equals: true, max_age_s: 5}
    effects:
      - {field: "{arm}_arm_safe", assign: true}
      - {field: "{arm}_arm_ready", assign: true}
    timeout_s: 15
  extend_arm:
    resources: [arm]
    incompatible_resources: [agv, lift]
    parameters: {arm: {type: string, enum: [left, right]}}
    preconditions:
      - {field: "{arm}_arm_ready", equals: true, max_age_s: 5}
    effects:
      - {field: "{arm}_arm_safe", assign: false}
    timeout_s: 15
  move_agv:
    resources: [agv]
    incompatible_resources: [arm, lift]
    parameters:
      distance_m: {type: number, minimum: -5.0, maximum: 5.0}
      speed_mps: {type: number, minimum: 0.01, maximum: 0.5, required: false}
    preconditions:
      - {field: agv_ready, equals: true, max_age_s: 5}
      - {field: left_arm_safe, equals: true, max_age_s: 5}
      - {field: right_arm_safe, equals: true, max_age_s: 5}
    effects:
      - {field: agv_position_m, increment_from_argument: distance_m}
    timeout_s: 30
  set_lift:
    resources: [lift]
    incompatible_resources: [agv, arm]
    parameters: {height_mm: {type: number, minimum: 0.0, maximum: 780.0}}
    preconditions:
      - {field: lift_ready, equals: true, max_age_s: 5}
      - {field: left_arm_safe, equals: true, max_age_s: 5}
      - {field: right_arm_safe, equals: true, max_age_s: 5}
    effects:
      - {field: lift_height_mm, assign_from_argument: height_mm}
    timeout_s: 20
  set_head:
    resources: [head]
    parameters:
      yaw_deg: {type: number, minimum: -90.0, maximum: 90.0, required: false}
      pitch_deg: {type: number, minimum: -45.0, maximum: 20.0, required: false}
    preconditions:
      - {field: head_ready, equals: true, max_age_s: 5}
    effects:
      - {field: head_yaw_deg, assign_from_argument: yaw_deg, when_argument: yaw_deg}
      - {field: head_pitch_deg, assign_from_argument: pitch_deg, when_argument: pitch_deg}
    timeout_s: 10
