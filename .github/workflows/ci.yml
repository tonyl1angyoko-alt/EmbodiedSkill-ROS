name: Portable CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Pure Python / ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Report discovered test inventory
        run: python scripts/report_test_inventory.py
      - name: Run portable unittest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  quality:
    name: Static and contract checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Expose ROS ament-style script directory
        run: echo "$(python -c 'import sys; print(sys.prefix)')/lib/embodied_skill_ros" >> "$GITHUB_PATH"
      - name: Ruff
        run: ruff check .
      - name: Pyright portable baseline
        run: pyright
      - name: Metadata, registry, and freeze consistency
        run: python scripts/verify_project_hygiene.py

# This workflow deliberately provides portable software evidence only. The committed
# Ubuntu 22.04 / ROS2 Humble and JAKA/Kargo exact-schema artifacts remain release
# evidence; no vendor node, SDK session, external workspace, or hardware is assumed.
