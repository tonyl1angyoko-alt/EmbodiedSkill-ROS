schema_version: 2
decision_priority: [EXECUTE, REPAIR, REPLAN, STOP]
constraints:
  - id: emergency_stop
    condition: emergency_stop == true
    repairable: false
  - id: robot_fault
    condition: fault != null
    repairable: false
  - id: exclusive_body_resource
    condition: required_resources intersects active_resources
    repairable: true
  - id: declarative_preconditions
    condition: every SkillContract predicate must be KNOWN, fresh, and true
    repair: "find a registered effect that establishes the required fact"
  - id: parallel_body_conflict
    condition: "required_resources intersects another skill's incompatible_resources"
    repair: "serialize the parallel group, then repair unsatisfied predicates from effects"
recovery:
  max_local_retries: 1
  max_replans: 1
  order: [local_retry, parameter_correction, preparation_action, alternative_skill, replan, safe_stop]
