[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-skill-ros"
version = "0.3.0"
description = "Contract-driven reliable skill execution for ROS2 robots"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ros2: requires Ubuntu 22.04 with a sourced ROS2 Humble runtime",
]

[tool.setuptools.packages.find]
include = ["embodied_skill_ros*"]
